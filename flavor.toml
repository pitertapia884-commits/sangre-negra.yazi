# Flavor: sangre-negra
# Paleta: negro puro + rojo vino / rojo sangre

[mgr]
cwd = { fg = "#8b0000" }

find_keyword  = { fg = "#8b0000", bold = true, italic = true, underline = true }
find_position = { fg = "#c0392b", bg = "reset", bold = true, italic = true }

marker_copied   = { fg = "#8b0000", bg = "#8b0000" }
marker_cut      = { fg = "#c0392b", bg = "#c0392b" }
marker_marked   = { fg = "#6b0000", bg = "#6b0000" }
marker_selected = { fg = "#3d0000", bg = "#3d0000" }
marker_symbol   = "│"

border_symbol = "│"
border_style  = { fg = "#2a0000" }


[tabs]
active   = { bg = "#8b0000", bold = true }
inactive = { fg = "#8b0000", bg = "#1a0000" }

sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { bg = "#8b0000", bold = true }
normal_alt  = { fg = "#8b0000", bg = "#1a0000" }
select_main = { bg = "#c0392b", bold = true }
select_alt  = { fg = "#c0392b", bg = "#2a0000" }
unset_main  = { bg = "#6b0000", bold = true }
unset_alt   = { fg = "#6b0000", bg = "#1a0000" }

[indicator]
parent  = { reversed = true }
current = { reversed = true }
preview = { underline = true }
padding = { open = "", close = "" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_sep   = { fg = "#333333" }
perm_type  = { fg = "#8b0000" }
perm_read  = { fg = "#c0392b" }
perm_write = { fg = "#6b0000" }
perm_exec  = { fg = "#922b21" }

progress_label  = { bold = true }
progress_normal = { fg = "#8b0000", bg = "black" }
progress_error  = { fg = "#c0392b", bg = "#1a0000" }

[which]
cols = 3
mask            = { bg = "black" }
cand            = { fg = "#c0392b" }
rest            = { fg = "#333333" }
desc            = { fg = "#555555" }
separator       = "  "
separator_style = { fg = "#2a0000" }

[confirm]
border  = { fg = "#8b0000" }
title   = { fg = "#c0392b" }
body    = {}
list    = {}
btn_yes = { reversed = true }
btn_no  = {}
btn_labels = [ " [S]í ", " (N)o " ]

[spot]
border   = { fg = "#8b0000" }
title    = { fg = "#c0392b" }
tbl_col  = { fg = "#8b0000" }
tbl_cell = { fg = "#c0392b", reversed = true }

[notify]
title_info  = { fg = "#8b0000" }
title_warn  = { fg = "#c0392b" }
title_error = { fg = "#ff0000" }
icon_info  = ""
icon_warn  = ""
icon_error = ""

[pick]
border   = { fg = "#8b0000" }
active   = { fg = "#c0392b", bold = true }
inactive = {}

[input]
border   = { fg = "#8b0000" }
title    = {}
value    = {}
selected = { reversed = true }

[cmp]
border   = { fg = "#8b0000" }
active   = { reversed = true }
inactive = {}
icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#8b0000" }
title   = {}
hovered = { fg = "#c0392b", bold = true }

[help]
on      = { fg = "#8b0000" }
run     = { fg = "#c0392b" }
desc    = {}
hovered = { reversed = true, bold = true }
footer  = { fg = "black", bg = "#8b0000" }

[filetype]
rules = [
  { mime = "image/*",                                                                                        fg = "#a0522d" },
  { mime = "{audio,video}/*",                                                                                fg = "#922b21" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#c0392b" },
  { mime = "application/{pdf,doc,rtf}",                                                                     fg = "#8b0000" },
  { mime = "text/*",                                                                                         fg = "#8b0000" },
  { mime = "vfs/{absent,stale}",                                                                             fg = "#333333" },
  { url = "*", is = "orphan", bg = "#3d0000" },
  { url = "*", is = "exec",   fg = "#c0392b" },
  { url = "*", is = "dummy",  bg = "#1a0000" },
  { url = "*/", is = "dummy", bg = "#1a0000" },
  { url = "*/", fg = "#8b0000" },
  { url = "*",  fg = "#8b0000" },
]

